name: Phase 17 Release Gate
on:
  push:
  pull_request:
jobs:
  gate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [cc]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release gate
        env:
          CC: ${{ matrix.compiler }}
        run: python3 tools/release_gate.py
