<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora OS — Security Findings & Remediations</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --heading: #f0f6fc;
      --accent: #58a6ff;
      --accent-green: #3fb950;
      --accent-red: #f85149;
      --accent-yellow: #d29922;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      --mono: "SFMono-Regular", Consolas, Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.6;
      padding-bottom: 60px;
    }
    header {
      background: #010409;
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo-badge {
      background: linear-gradient(135deg, #1f6feb, #8957e5);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      padding: 6px 12px;
      border-radius: 8px;
    }
    h1 { color: var(--heading); font-size: 20px; font-weight: 600; }
    nav { display: flex; gap: 14px; }
    nav a {
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 6px;
    }
    nav a:hover, nav a.active {
      background: var(--card-bg);
      color: var(--accent);
      border: 1px solid var(--border);
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .filter-group { display: flex; gap: 8px; }
    .btn-filter {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-filter.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .search-input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--heading);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      min-width: 260px;
    }
    .finding-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 24px;
      transition: border-color 0.2s;
    }
    .finding-card:hover { border-color: #58a6ff66; }
    .finding-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .finding-title {
      font-size: 18px;
      color: var(--heading);
      font-weight: 600;
    }
    .badges { display: flex; gap: 8px; align-items: center; }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-high { background: #f8514922; color: var(--accent-red); border: 1px solid #f8514944; }
    .badge-medium { background: #d2992222; color: var(--accent-yellow); border: 1px solid #d2992244; }
    .badge-owasp { background: #1f6feb22; color: var(--accent); border: 1px solid #1f6feb44; font-weight: 500; }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 14px;
      font-family: var(--mono);
    }
    .meta-row span { color: var(--text); }
    .desc-box {
      font-size: 14px;
      color: var(--text);
      margin-bottom: 12px;
    }
    .impact-box {
      background: #090d13;
      border-left: 3px solid var(--accent-red);
      padding: 10px 14px;
      font-size: 13px;
      border-radius: 0 6px 6px 0;
      margin-bottom: 18px;
    }
    .impact-box strong { color: var(--accent-red); }
    .code-container {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .code-tabs {
      display: flex;
      background: #010409;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      padding: 8px 16px;
      background: transparent;
      border: none;
      color: #8b949e;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-right: 1px solid var(--border);
    }
    .tab-btn.active {
      background: #0d1117;
      color: var(--heading);
    }
    .tab-btn.tab-before.active { color: var(--accent-red); }
    .tab-btn.tab-after.active { color: var(--accent-green); }
    pre.code-view {
      background: #0d1117;
      padding: 16px;
      font-family: var(--mono);
      font-size: 13px;
      overflow-x: auto;
      line-height: 1.5;
      color: #e6edf3;
    }
    .verify-box {
      margin-top: 14px;
      padding: 10px 14px;
      background: #3fb95015;
      border: 1px solid #3fb95044;
      border-radius: 6px;
      font-size: 13px;
      color: #7ee787;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    footer { text-align: center; color: #484f58; font-size: 13px; margin-top: 48px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo-badge">NX</div>
      <h1>Nexora Security Findings & Code Remediations</h1>
    </div>
    <nav>
      <a href="index.html">Overview</a>
      <a href="findings.html" class="active">Security Findings (7/7)</a>
      <a href="boot-sim.html">Boot Simulation</a>
    </nav>
  </header>

  <div class="container">
    <div class="controls">
      <div class="filter-group">
        <button class="btn-filter active" onclick="filterSeverity('all', this)">All (7)</button>
        <button class="btn-filter" onclick="filterSeverity('High', this)">High Severity (5)</button>
        <button class="btn-filter" onclick="filterSeverity('Medium', this)">Medium Severity (2)</button>
      </div>
      <input type="text" id="searchInput" class="search-input" placeholder="Search finding, file, or OWASP..." oninput="handleSearch()">
    </div>

    <div id="findingsContainer">
      <!-- Injected by JavaScript -->
    </div>
  </div>

  <footer>
    Nexora Security Audit &bull; OWASP Top 10: 2025 Framework &bull; Authored by abusuraihsakhri
  </footer>

  <script>
    let findingsData = [];

    async function loadFindings() {
      try {
        const res = await fetch('findings.json');
        if (!res.ok) throw new Error('Fetch failed');
        findingsData = await res.json();
      } catch (e) {
        // Fallback embedded data for file:// execution
        findingsData = [
          {
            "id": 1,
            "title": "SYSRET Non-Canonical Return RIP (#GP in Ring 0)",
            "severity": "High",
            "owasp_category": "A10:2025 - Mishandling of Exceptional Conditions",
            "file": "Nexora_Phase_05/arch/x86_64/syscall_entry.S",
            "location": "syscall_entry.S -> nexora_syscall_entry:46-50",
            "commit": "2d8ecd1",
            "description": "sysretq returns execution to the address in %rcx. On x86_64 Intel processors, executing sysretq with a non-canonical RIP triggers a General Protection Fault (#GP) in Ring 0 with user stack/state active (CVE-2012-0217 class vulnerability).",
            "impact": "Local privilege escalation or kernel crash callable from unprivileged Ring 3 execution.",
            "code_before": "    movq 64(%rsp), %rcx\n    addq $72, %rsp\n    movq nexora_syscall_user_rsp(%rip), %rsp\n    swapgs\n    sysretq",
            "code_after": "    /* Security check: Return RIP must be in canonical user space (bits 47..63 == 0) */\n    movq 64(%rsp), %rcx\n    movq %rcx, %rax\n    shrq $47, %rax\n    jnz .Lsyscall_sysret_non_canonical\n\n    /* ... restore registers ... */\n    movq %gs:8, %rsp\n    swapgs\n    sysretq\n\n.Lsyscall_sysret_non_canonical:\n    movq %rsp, %rdi\n    subq $8, %rsp\n    call nexora_syscall_bad_rip_fault\n    addq $8, %rsp\n1:  hlt\n    jmp 1b",
            "verify_method": "Unit test test_syscall_return_frame_rejects_non_canonical_rip in tests/test_syscall.c asserting safe fault path execution.",
            "verify_result": "PASS (Test group 21/24)"
          },
          {
            "id": 2,
            "title": "Shared Global Syscall Stack in .bss",
            "severity": "High",
            "owasp_category": "A06:2025 - Insecure Design",
            "file": "Nexora_Phase_05/arch/x86_64/syscall_entry.S",
            "location": "syscall_entry.S -> nexora_syscall_entry:19-21, 55",
            "commit": "24a875e",
            "description": "Syscall entry and exit saved and restored the user stack pointer from singleton global memory (.bss scratch) rather than per-CPU local storage. Re-entrancy or concurrent multicore syscalls clobber the stack frame.",
            "impact": "Stack corruption, return pointer clobbering, and kernel memory tampering under re-entrant or SMP execution.",
            "code_before": "    swapgs\n    movq %rsp, nexora_syscall_user_rsp(%rip)\n    movq nexora_syscall_kernel_rsp(%rip), %rsp\n    /* ... */\n    movq nexora_syscall_user_rsp(%rip), %rsp\n    swapgs\n    sysretq",
            "code_after": "    swapgs\n    movq %rsp, %gs:8   /* per-CPU user_rsp */\n    movq %gs:0, %rsp   /* per-CPU kernel_rsp */\n    /* ... */\n    movq %gs:8, %rsp\n    swapgs\n    sysretq",
            "verify_method": "Unit test test_percpu_stack_reentrancy_isolation in tests/test_syscall.c asserting isolated stack preservation.",
            "verify_result": "PASS (Test group 24/24)"
          },
          {
            "id": 3,
            "title": "ELF Loader Overlapping PT_LOAD Segments (W^X Bypass)",
            "severity": "High",
            "owasp_category": "A01:2025 - Broken Access Control",
            "file": "Nexora_Phase_05/kernel/elf64.c",
            "location": "kernel/elf64.c -> nexora_elf64_load:109-128",
            "commit": "6c76949",
            "description": "The ELF loader checked W^X permissions per-segment, but failed to check if two segments overlapped in virtual memory. An attacker could map an RW segment over an RX segment, defeating W^X protections.",
            "impact": "Arbitrary code injection into executable memory pages in loaded userspace processes.",
            "code_before": "    if (!loaded_any) return NEXORA_ERR(NEXORA_EINVAL);\n    if (!entry_in_executable_segment) return NEXORA_ERR(NEXORA_EACCES);\n\n    /* Mapping pass directly without pairwise overlap check */",
            "code_after": "    /* Pairwise overlap check: reject images with intersecting PT_LOAD segments */\n    for (uint16_t i = 0; i < eh->phnum; ++i) {\n        /* ... compute start_i, end_i ... */\n        for (uint16_t j = i + 1; j < eh->phnum; ++j) {\n            if (start_i < end_j && start_j < end_i) return NEXORA_ERR(NEXORA_EINVAL);\n        }\n    }",
            "verify_method": "Unit test test_elf_loader_rejects_overlapping_segments with hand-built overlapping ELF, asserting NEXORA_EINVAL.",
            "verify_result": "PASS (Test group 22/24)"
          },
          {
            "id": 4,
            "title": "Unhandled Page Fault in uaccess Byte Copy",
            "severity": "High",
            "owasp_category": "A10:2025 - Mishandling of Exceptional Conditions",
            "file": "Nexora_Phase_05/kernel/uaccess.c",
            "location": "kernel/uaccess.c -> nexora_copy_from_user / nexora_copy_to_user",
            "commit": "dc97572",
            "description": "uaccess byte_copy raw-dereferenced user pointers. If a user pointer was in-bounds but mapped to an uncommitted or unmapped virtual page, touching it in kernel mode triggered a kernel page fault panic in Ring 0.",
            "impact": "Local Denial of Service / Kernel panic triggerable by unprivileged userspace passing invalid or unmapped addresses to system calls.",
            "code_before": "    byte_copy(kernel_dst, user_src, length);\n    return NEXORA_OK;",
            "code_after": "    if (!copy_safe(kernel_dst, user_src, length, (uintptr_t)user_src, false)) {\n        return NEXORA_ERR(NEXORA_EFAULT);\n    }\n    return NEXORA_OK;\n    /* Supported by .fixup_table exception recovery */",
            "verify_method": "Unit test test_uaccess_unmapped_page_fault_fixup passing unmapped in-range pointer and asserting -EFAULT return without panicking.",
            "verify_result": "PASS (Test group 20/24)"
          },
          {
            "id": 5,
            "title": "Kernel panic() on Malformed AI Object Input",
            "severity": "Medium",
            "owasp_category": "A10:2025 - Mishandling of Exceptional Conditions",
            "file": "Nexora_Phase_14/src/ai/tensor.c, work.c",
            "location": "src/ai/tensor.c:50-94, src/ai/work.c:22-30",
            "commit": "4b8bfd7",
            "description": "AI tensor and work node creation called panic() when encountering malformed inputs such as null pointers, zero dimensions, rank overflow, or registry exhaustion. In syscall paths, invalid input must return error codes rather than halting the system.",
            "impact": "Unprivileged Denial of Service: arbitrary processes could trigger a complete operating system halt.",
            "code_before": "    if (!name || !shape) panic(\"tensor name/shape must not be null\");\n    if (ndim == 0 || ndim > AI_MAX_DIMS) panic(\"invalid tensor rank\");",
            "code_after": "i32 ai_tensor_create_safe(...) {\n    if (!out_tensor) return -1;\n    if (count >= AI_MAX_TENSORS) return -2;\n    if (!name || !shape) return -3;\n    /* ... returns error codes to caller ... */\n}",
            "verify_method": "Fuzz testing suite test_malformed_ai_input_fuzz in tests/test_phase14.c evaluating nulls, zeros, and overflows.",
            "verify_result": "PASS (87/87 TAP tests passed)"
          },
          {
            "id": 6,
            "title": "Non-IRQ-Safe Trace Ring Spinlock Deadlock",
            "severity": "Medium",
            "owasp_category": "A10:2025 - Mishandling of Exceptional Conditions",
            "file": "Nexora_Phase_17/src/phase17/trace.c",
            "location": "src/phase17/trace.c -> nx_trace_emit:42-58",
            "commit": "1acf8ba",
            "description": "nx_trace_emit acquired an atomic writer lock without disabling interrupts. If an interrupt service routine (ISR) fired on the same CPU while the lock was held and emitted a trace event, the ISR would spin forever waiting for the interrupted thread.",
            "impact": "Permanent CPU core freeze / deadlock whenever trace events were emitted from both thread and ISR contexts.",
            "code_before": "    while (atomic_flag_test_and_set_explicit(&slot->writer_lock, memory_order_acquire)) {\n        /* spin without masking interrupts */\n    }",
            "code_after": "    const unsigned long irq_flags = nx_irq_save_disable();\n    while (atomic_flag_test_and_set_explicit(&slot->writer_lock, memory_order_acquire)) {}\n    /* ... write slot ... */\n    atomic_flag_clear_explicit(&slot->writer_lock, memory_order_release);\n    nx_irq_restore(irq_flags);",
            "verify_method": "Re-entrant mock ISR callback test test_trace_irq_safe in tests/test_phase17.c asserting IRQ disabled state.",
            "verify_result": "PASS (All C tests passed, manifest verified)"
          },
          {
            "id": 7,
            "title": "Unrestricted Capability Delegation in sys_cap_delegate",
            "severity": "High",
            "owasp_category": "A01:2025 - Broken Access Control",
            "file": "Nexora_Phase_05/kernel/syscall.c",
            "location": "kernel/syscall.c -> sys_cap_delegate:277-285",
            "commit": "ff2f2eb",
            "description": "sys_cap_delegate permitted any process to lookup any target_pid and inject handles directly into that process's handle table without verifying whether the caller was a parent process or possessed an authorized IPC channel.",
            "impact": "Cross-process capability tampering, handle table exhaustion attacks, and unauthorized capability injection.",
            "code_before": "    struct nexora_process *target = nexora_process_lookup(request.target_pid);\n    if (!target) return NEXORA_ERR(NEXORA_ENOENT);\n    status = ops->retain(type, object);",
            "code_after": "    struct nexora_process *target = nexora_process_lookup(request.target_pid);\n    if (!target) return NEXORA_ERR(NEXORA_ENOENT);\n    if (target->pid != process->pid && target->parent_pid != process->pid) {\n        return NEXORA_ERR(NEXORA_EPERM);\n    }\n    status = ops->retain(type, object);",
            "verify_method": "Unit test test_capability_delegation_rejects_unrelated_process in tests/test_syscall.c asserting NEXORA_EPERM.",
            "verify_result": "PASS (Test group 23/24)"
          }
        ];
      }
      renderFindings(findingsData);
    }

    function renderFindings(items) {
      const c = document.getElementById('findingsContainer');
      c.innerHTML = items.map(f => `
        <div class="finding-card" data-severity="${f.severity}">
          <div class="finding-header">
            <div class="finding-title">#${f.id} — ${f.title}</div>
            <div class="badges">
              <span class="badge ${f.severity === 'High' ? 'badge-high' : 'badge-medium'}">${f.severity} Severity</span>
              <span class="badge badge-owasp">${f.owasp_category}</span>
            </div>
          </div>
          <div class="meta-row">
            <div>File: <span>${f.file}</span></div>
            <div>Location: <span>${f.location}</span></div>
            <div>Commit: <span>${f.commit}</span></div>
          </div>
          <div class="desc-box">${f.description}</div>
          <div class="impact-box"><strong>Impact:</strong> ${f.impact}</div>

          <div class="code-container">
            <div class="code-tabs">
              <button class="tab-btn tab-after active" onclick="switchCodeTab(this, 'after-${f.id}')">Remediated Code (Fixed)</button>
              <button class="tab-btn tab-before" onclick="switchCodeTab(this, 'before-${f.id}')">Vulnerable Code (Before)</button>
            </div>
            <pre class="code-view" id="code-${f.id}">${escapeHtml(f.code_after)}</pre>
          </div>

          <div class="verify-box">
            <div><strong>Verification:</strong> ${f.verify_method}</div>
            <div><strong>Result:</strong> ${f.verify_result}</div>
          </div>
        </div>
      `).join('');
    }

    function switchCodeTab(btn, target) {
      const parent = btn.closest('.code-container');
      parent.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const id = target.split('-')[1];
      const mode = target.split('-')[0];
      const finding = findingsData.find(f => f.id == id);
      const codeEl = document.getElementById('code-' + id);
      if (finding && codeEl) {
        codeEl.textContent = mode === 'after' ? finding.code_after : finding.code_before;
      }
    }

    function filterSeverity(sev, btn) {
      document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (sev === 'all') {
        renderFindings(findingsData);
      } else {
        renderFindings(findingsData.filter(f => f.severity === sev));
      }
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = findingsData.filter(f =>
        f.title.toLowerCase().includes(query) ||
        f.file.toLowerCase().includes(query) ||
        f.owasp_category.toLowerCase().includes(query) ||
        f.description.toLowerCase().includes(query)
      );
      renderFindings(filtered);
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    window.addEventListener('DOMContentLoaded', loadFindings);
  </script>
</body>
</html>
