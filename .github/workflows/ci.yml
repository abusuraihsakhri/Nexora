name: Nexora CI

on:
  push:
    branches:
      - master
      - remediation/**
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Integrated kernel + QEMU
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc binutils grub-pc-bin grub-common xorriso qemu-system-x86
      - name: Host and freestanding verification
        run: make -C kernel verify-current
      - name: Build bootable ISO
        run: make -C kernel all
      - name: Headless QEMU smoke test
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/nexora-qemu.log"
          set +e
          timeout 12s qemu-system-x86_64 \
            -m 512M -smp 1 \
            -cdrom kernel/build/aikernel.iso \
            -serial stdio -display none -no-reboot -no-shutdown >"$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          if [[ $rc -ne 0 && $rc -ne 124 ]]; then exit "$rc"; fi
          grep -F "Nexora initialization complete." "$log"

  bench:
    name: Benchmark contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: make -C bench test

  qualification:
    name: Qualification + sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: make -C qualification test
      - run: make -C qualification demo
      - run: make -C qualification sanitize

  release:
    name: Release hardening gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: make -C release gate

  pages:
    name: Pages static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML documents
        run: |
          test -f docs/index.html
          test -f docs/boot-sim.html
          python3 - <<'PY'
          from pathlib import Path
          for p in (Path("docs/index.html"), Path("docs/boot-sim.html")):
              text = p.read_text(encoding="utf-8")
              low = text.lower()
              assert "<!doctype html" in low, p
              assert "<html" in low and "</html>" in low, p
              assert "<meta name=\"viewport\"" in low, p
          PY
